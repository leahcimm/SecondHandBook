spring.application.name=SecondHandBook
# 使用獨立的資料庫，不會和 BookReview 範例的 test 資料庫混在一起
spring.data.mongodb.database=secondhandbook
# 照片單張上限 10MB（整個表單上限稍大一點，留給其他欄位）
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
upload.path=upload
# 讓超過 10MB 的上傳也能收到「照片不可超過 10MB」的錯誤訊息，而不是連線被中斷
server.tomcat.max-swallow-size=-1
# T05：User 的 Email 要建唯一索引，避免同一個 Email 註冊兩次
spring.data.mongodb.auto-index-creation=true
# T05：登入 Cookie 設 SameSite=Lax，別的網站送來的 POST 不會帶登入狀態（CSRF 已關掉，PLAN 技術決定）
server.servlet.session.cookie.same-site=lax
