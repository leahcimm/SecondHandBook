<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海大二手書交易平台｜刊登書籍</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <style>
        #preview {
            max-height: 200px;
            display: none;
        }
    </style>
</head>
<body>
<nav id="navbar"></nav>

<div class="container" style="max-width: 720px;">
    <h1 class="h3 mb-3">刊登書籍</h1>
    <div id="serverError"></div>

    <form id="bookForm" novalidate>
        <div class="mb-3">
            <label for="title" class="form-label">書名 <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="title" name="title" placeholder="例如：資料結構（C 語言版）">
            <div class="invalid-feedback">請填寫書名</div>
        </div>
        <div class="mb-3">
            <label for="author" class="form-label">作者</label>
            <input type="text" class="form-control" id="author" name="author">
        </div>
        <div class="mb-3">
            <label for="subject" class="form-label">科目 <span class="text-danger">*</span></label>
            <select class="form-select" id="subject" name="subject">
                <option value="">請選擇科目</option>
            </select>
            <div class="invalid-feedback">請選擇科目</div>
        </div>
        <div class="mb-3">
            <label for="conditionGrade" class="form-label">書況等級 <span class="text-danger">*</span></label>
            <select class="form-select" id="conditionGrade" name="conditionGrade">
                <option value="">請選擇書況</option>
            </select>
            <div class="invalid-feedback">請選擇書況</div>
        </div>
        <div class="mb-3">
            <label for="condition" class="form-label">書況補充說明</label>
            <textarea class="form-control" id="condition" name="condition" rows="3" placeholder="例如：第 3 章有螢光筆畫記，封面右下角有折痕"></textarea>
        </div>
        <div class="mb-3">
            <label for="price" class="form-label">售價（元） <span class="text-danger">*</span></label>
            <input type="text" inputmode="numeric" class="form-control" id="price" name="price" placeholder="例如：250">
            <div class="invalid-feedback" id="priceError">售價必須為正整數</div>
        </div>
        <div class="mb-3">
            <label class="form-label">交付方式</label>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="meetup" checked disabled>
                <label class="form-check-label" for="meetup">校內面交（不收運費）</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="shippable" name="shippable" value="true">
                <label class="form-check-label" for="shippable">也可以寄送</label>
            </div>
            <div class="mt-2" id="shippingFeeGroup" style="display: none;">
                <label for="shippingFee" class="form-label">運費（元） <span class="text-danger">*</span></label>
                <input type="text" inputmode="numeric" class="form-control" id="shippingFee" name="shippingFee" placeholder="例如：60（賣家吸收運費填 0）">
                <div class="invalid-feedback">運費必須為 0 以上的整數</div>
            </div>
        </div>
        <div class="mb-3">
            <label for="image" class="form-label">書籍照片 <span class="text-danger">*</span></label>
            <input type="file" class="form-control" id="image" name="image" accept="image/jpeg,image/png,image/webp">
            <div class="invalid-feedback" id="imageError">請上傳書籍照片</div>
            <small class="form-text text-muted">JPG、PNG、WEBP，單張不超過 10MB</small>
            <div class="mt-2"><img id="preview" alt="照片預覽" class="img-thumbnail"></div>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="sellerName" class="form-label">賣家稱呼</label>
                <input type="text" class="form-control" id="sellerName" name="sellerName" placeholder="例如：資工三 阿明">
            </div>
            <div class="col-md-6 mb-3">
                <label for="sellerContact" class="form-label">聯絡方式</label>
                <input type="text" class="form-control" id="sellerContact" name="sellerContact" placeholder="Email 或 IG">
            </div>
        </div>
        <button type="submit" class="btn btn-primary">送出刊登</button>
        <a href="index.html" class="btn btn-secondary">取消</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script>
    const MAX_IMAGE_SIZE = 10 * 1024 * 1024; // 10MB
    const ALLOWED_TYPES = ['image/jpeg', 'image/png', 'image/webp'];

    function setError(id, message) {
        const input = document.getElementById(id);
        input.classList.add('is-invalid');
        if (message) {
            input.parentElement.querySelector('.invalid-feedback').textContent = message;
        }
    }

    function clearErrors() {
        document.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
        document.getElementById('serverError').innerHTML = '';
    }

    // 送出前先在瀏覽器檢查一次；後端也會再檢查一次（不能只靠前端）
    function validateForm() {
        let ok = true;
        if (!document.getElementById('title').value.trim()) {
            setError('title', '請填寫書名');
            ok = false;
        }
        if (!document.getElementById('subject').value) {
            setError('subject', '請選擇科目');
            ok = false;
        }
        if (!document.getElementById('conditionGrade').value) {
            setError('conditionGrade', '請選擇書況');
            ok = false;
        }
        const price = document.getElementById('price').value.trim();
        if (!price) {
            setError('price', '請填寫售價');
            ok = false;
        } else if (!/^[0-9]+$/.test(price) || parseInt(price, 10) <= 0) {
            setError('price', '售價必須為正整數');
            ok = false; // "/^[0-9]+$/" 規則：只能由數字 0–9 組成
        }
        if (document.getElementById('shippable').checked) {
            const fee = document.getElementById('shippingFee').value.trim();
            if (!fee) {
                setError('shippingFee', '勾選寄送時請填寫運費');
                ok = false;
            } else if (!/^[0-9]+$/.test(fee)) {
                setError('shippingFee', '運費必須為 0 以上的整數');
                ok = false;
            }
        }
        const image = document.getElementById('image').files[0];
        if (!image) {
            setError('image', '請上傳書籍照片');
            ok = false;
        } else if (!ALLOWED_TYPES.includes(image.type)) {
            setError('image', '照片格式只接受 JPG、PNG、WEBP');
            ok = false;
        } else if (image.size > MAX_IMAGE_SIZE) {
            setError('image', '照片不可超過 10MB');
            ok = false;
        }
        return ok;
    }

    // 勾選「也可以寄送」才顯示運費欄位
    document.getElementById('shippable').addEventListener('change', function () {
        document.getElementById('shippingFeeGroup').style.display = this.checked ? 'block' : 'none';
    });

    document.getElementById('image').addEventListener('change', function () {
        const preview = document.getElementById('preview');
        const file = this.files[0];
        if (file && file.type.startsWith('image/')) {
            preview.src = URL.createObjectURL(file);
            preview.style.display = 'block';
        } else {
            preview.style.display = 'none';
        }
    });

    document.getElementById('bookForm').addEventListener('submit', function (e) {
        e.preventDefault();
        clearErrors();
        if (!validateForm()) {
            return;
        }

        const formData = new FormData(this);
        const submitButton = this.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        submitButton.textContent = '送出中...';

        fetch('/api/books', { //按下送出時，把表單打包送到 /api/books
            method: 'POST',
            body: formData
        })
            .then(response => response.json().then(data => ({ ok: response.ok, data })))
            .then(({ ok, data }) => {
                if (!ok) {
                    throw new Error(data.message || '刊登失敗');
                }
                window.location.href = 'index.html?posted=1';
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('serverError').innerHTML =
                    '<div class="alert alert-danger">刊登失敗：' + escapeHtml(error.message) + '</div>';
            })
            .finally(() => {
                submitButton.disabled = false;
                submitButton.textContent = '送出刊登';
            });
    });

    document.addEventListener('DOMContentLoaded', function () {
        renderNavbar();
        // 賣家稱呼預設帶入右上角的名稱，之後才能用同一個名稱處理收到的訂單
        document.getElementById('sellerName').value = getUserName();
        fillSubjectOptions(document.getElementById('subject'));
        fillConditionOptions(document.getElementById('conditionGrade'), true);
    });
</script>
</body>
</html>
