<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海大二手書交易平台｜註冊</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
</head>
<body>
<nav id="navbar"></nav>

<div class="container" style="max-width: 560px;">
    <h1 class="h3 mb-3">註冊帳號</h1>
    <div id="serverError"></div>

    <form id="registerForm" novalidate>
        <div class="mb-3">
            <label for="name" class="form-label">姓名 <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="name" autocomplete="name" placeholder="會顯示在你刊登的書上">
            <div class="invalid-feedback">請填寫姓名</div>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">學校 Email <span class="text-danger">*</span></label>
            <input type="email" class="form-control" id="email" autocomplete="username"
                   placeholder="例如：01234567@mail.ntou.edu.tw">
            <div class="invalid-feedback">請填寫 Email</div>
            <small class="form-text text-muted">只收 @mail.ntou.edu.tw，之後用它登入。</small>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">密碼 <span class="text-danger">*</span></label>
            <input type="password" class="form-control" id="password" autocomplete="new-password">
            <div class="invalid-feedback">密碼至少要 8 個字元</div>
            <small class="form-text text-muted">至少 8 個字元。</small>
        </div>
        <div class="mb-3">
            <label for="passwordAgain" class="form-label">再輸入一次密碼 <span class="text-danger">*</span></label>
            <input type="password" class="form-control" id="passwordAgain" autocomplete="new-password">
            <div class="invalid-feedback">兩次輸入的密碼不一樣</div>
        </div>
        <div class="mb-3">
            <label for="contact" class="form-label">聯絡方式 <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="contact" placeholder="例如：IG @ntou_ming 或 LINE ID">
            <div class="invalid-feedback">請填寫聯絡方式</div>
            <small class="form-text text-muted">會顯示在你刊登的書上，讓買家聯絡你。</small>
        </div>
        <button type="submit" class="btn btn-primary w-100">註冊</button>
    </form>
    <p class="mt-3 text-center">已經有帳號？<a href="login.html">登入</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script>
    function setError(id, message) {
        const input = document.getElementById(id);
        input.classList.add('is-invalid');
        if (message) input.parentElement.querySelector('.invalid-feedback').textContent = message;
    }

    // 前端先擋明顯的錯誤；Email 網域、重複帳號等規則以後端為準，後端的原因直接顯示
    function validateForm() {
        let ok = true;
        if (!document.getElementById('name').value.trim()) { setError('name', '請填寫姓名'); ok = false; }
        if (!document.getElementById('email').value.trim()) { setError('email', '請填寫 Email'); ok = false; }
        const password = document.getElementById('password').value;
        if (password.length < 8) { setError('password', '密碼至少要 8 個字元'); ok = false; }
        if (document.getElementById('passwordAgain').value !== password) {
            setError('passwordAgain', '兩次輸入的密碼不一樣');
            ok = false;
        }
        if (!document.getElementById('contact').value.trim()) { setError('contact', '請填寫聯絡方式'); ok = false; }
        return ok;
    }

    document.getElementById('registerForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        document.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
        document.getElementById('serverError').innerHTML = '';
        if (!validateForm()) return;

        const button = this.querySelector('button[type="submit"]');
        button.disabled = true;
        button.textContent = '註冊中...';
        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('name').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    password: document.getElementById('password').value,
                    contact: document.getElementById('contact').value.trim()
                })
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.message || '註冊失敗');
            // US01 測試方法：註冊成功後跳到登入頁（註冊不會自動登入，T05）
            window.location.href = 'login.html?registered=1';
        } catch (error) {
            const message = error.message === 'Failed to fetch' ? '無法連線到伺服器，請稍後再試' : error.message;
            document.getElementById('serverError').innerHTML =
                `<div class="alert alert-danger" id="registerError">註冊失敗：${escapeHtml(message)}</div>`;
            button.disabled = false;
            button.textContent = '註冊';
        }
    });

    document.addEventListener('DOMContentLoaded', async function () {
        const user = await renderNavbar();
        if (user) {
            document.getElementById('serverError').innerHTML =
                `<div class="alert alert-info">你已經用 ${escapeHtml(user.name)} 登入了。要註冊新帳號，請先登出。</div>`;
        }
    });
</script>
</body>
</html>
