<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海大二手書交易平台｜書籍列表</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <style>
        .book-image-container {
            width: 100%;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
            overflow: hidden;
        }
        .book-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .card {
            height: 100%;
        }
        .price {
            font-size: 1.25rem;
            font-weight: bold;
            color: #d63384;
        }
        .condition {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="index.html"><i class="fas fa-book"></i> 海大二手書交易平台</a>
        <a class="btn btn-light" href="sell.html"><i class="fas fa-plus"></i> 刊登書籍</a>
    </div>
</nav>

<div class="container">
    <div id="message"></div>

    <h1 class="h3 mb-3">書籍列表</h1>

    <!-- 搜尋與科目篩選 -->
    <form id="searchForm" class="row g-2 mb-4">
        <div class="col-md-6">
            <input type="text" class="form-control" id="keyword" placeholder="輸入書名關鍵字，例如：資料">
        </div>
        <div class="col-md-4">
            <select class="form-select" id="subject">
                <option value="">全部科目</option>
            </select>
        </div>
        <div class="col-md-2 d-grid">
            <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i> 搜尋</button>
        </div>
    </form>

    <p class="text-muted" id="resultCount"></p>
    <div id="bookList" class="row"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script>
    function fetchBooks() {
        const params = new URLSearchParams();
        const keyword = document.getElementById('keyword').value.trim();
        const subject = document.getElementById('subject').value;
        if (keyword) params.append('keyword', keyword);
        if (subject) params.append('subject', subject);

        fetch('/api/books?' + params.toString())
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(books => renderBooks(books, keyword || subject))
            .catch(error => {
                console.error('Error fetching books:', error);
                document.getElementById('bookList').innerHTML =
                    '<div class="col-12"><div class="alert alert-danger">無法載入書籍，請稍後再試。錯誤訊息：' + escapeHtml(error.message) + '</div></div>';
            });
    }

    function renderBooks(books, isFiltered) {
        const bookList = document.getElementById('bookList');
        const resultCount = document.getElementById('resultCount');
        bookList.innerHTML = '';

        // 空狀態：沒有任何書時顯示提示，而不是一片空白
        if (books.length === 0) {
            resultCount.textContent = '';
            bookList.innerHTML = `
                <div class="col-12">
                    <div class="alert alert-secondary text-center" id="emptyState">
                        ${isFiltered ? '找不到符合條件的書籍' : '目前沒有書籍'}
                    </div>
                </div>`;
            return;
        }

        resultCount.textContent = `共 ${books.length} 本`;
        books.forEach(book => {
            const bookElement = document.createElement('div');
            bookElement.className = 'col-sm-6 col-lg-4 mb-4';
            bookElement.innerHTML = `
                <div class="card book-card">
                    <div class="book-image-container">
                        <img src="${escapeHtml(book.imageUrl)}" alt="書籍照片" class="book-image">
                    </div>
                    <div class="card-body">
                        <h5 class="card-title">${escapeHtml(book.title)}</h5>
                        <span class="badge bg-info text-dark mb-2">${escapeHtml(book.subject)}</span>
                        <span class="badge bg-warning text-dark mb-2">${escapeHtml(book.status)}</span>
                        <p class="price mb-2">NT$ ${book.price}</p>
                        ${book.author ? `<p class="card-text mb-1">作者：${escapeHtml(book.author)}</p>` : ''}
                        ${book.condition ? `<p class="card-text condition mb-1">書況：${escapeHtml(book.condition)}</p>` : ''}
                        ${book.sellerName ? `<p class="card-text text-muted small mb-0">賣家：${escapeHtml(book.sellerName)}</p>` : ''}
                    </div>
                </div>`;
            bookList.appendChild(bookElement);
        });
    }

    document.getElementById('searchForm').addEventListener('submit', function (e) {
        e.preventDefault();
        fetchBooks();
    });

    // 選科目後直接篩選，不用再按搜尋
    document.getElementById('subject').addEventListener('change', fetchBooks);

    document.addEventListener('DOMContentLoaded', function () {
        fillSubjectOptions(document.getElementById('subject'));

        // 從刊登頁成功跳轉過來時，顯示成功訊息
        if (new URLSearchParams(window.location.search).get('posted') === '1') {
            document.getElementById('message').innerHTML =
                '<div class="alert alert-success alert-dismissible fade show" id="successMessage">刊登成功！書籍狀態為「待審核」。' +
                '<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>';
            history.replaceState(null, '', 'index.html');
        }

        fetchBooks();
    });
</script>
</body>
</html>
