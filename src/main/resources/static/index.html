<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海大二手書交易平台｜書籍列表</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <style>
        .book-image-container {
            width: 100%;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
            overflow: hidden;
        }
        .book-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .card {
            height: 100%;
        }
        .price {
            font-size: 1.25rem;
            font-weight: bold;
            color: #d63384;
        }
        .condition {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
<nav id="navbar"></nav>

<div class="container">
    <div id="message"></div>

    <h1 class="h3 mb-3">書籍列表</h1>

    <!-- 搜尋與科目篩選 -->
    <form id="searchForm" class="row g-2 mb-4">
        <div class="col-md-4">
            <input type="text" class="form-control" id="keyword" placeholder="輸入書名關鍵字，例如：資料">
        </div>
        <div class="col-md-2">
            <select class="form-select" id="subject">
                <option value="">全部科目</option>
            </select>
        </div>
        <div class="col-md-2">
            <select class="form-select" id="conditionGrade">
                <option value="">全部書況</option>
            </select>
        </div>
        <div class="col-md-2">
            <select class="form-select" id="sort">
                <option value="price">價格低到高</option>
                <option value="newest">最新刊登</option>
                <option value="condition">書況由新到舊</option>
            </select>
        </div>
        <div class="col-md-2 d-grid">
            <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i> 搜尋</button>
        </div>
    </form>

    <p class="text-muted" id="resultCount"></p>
    <div id="bookList" class="row"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script>
    let lastBooks = [];
    let lastFiltered = false;

    function fetchBooks() {
        const params = new URLSearchParams();
        const keyword = document.getElementById('keyword').value.trim();
        const subject = document.getElementById('subject').value;
        const conditionGrade = document.getElementById('conditionGrade').value;
        if (keyword) params.append('keyword', keyword);
        if (subject) params.append('subject', subject);
        if (conditionGrade) params.append('conditionGrade', conditionGrade);
        params.append('sort', document.getElementById('sort').value);

        fetch('/api/books?' + params.toString())
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(books => {
                lastBooks = books;
                lastFiltered = keyword || subject || conditionGrade;
                renderBooks(books, lastFiltered);
            })
            .catch(error => {
                console.error('Error fetching books:', error);
                document.getElementById('bookList').innerHTML =
                    '<div class="col-12"><div class="alert alert-danger">無法載入書籍，請稍後再試。錯誤訊息：' + escapeHtml(error.message) + '</div></div>';
            });
    }

    function renderBooks(books, isFiltered) {
        const bookList = document.getElementById('bookList');
        const resultCount = document.getElementById('resultCount');
        bookList.innerHTML = '';

        // 空狀態：沒有任何書時顯示提示，而不是一片空白
        if (books.length === 0) {
            resultCount.textContent = '';
            bookList.innerHTML = `
                <div class="col-12">
                    <div class="alert alert-secondary text-center" id="emptyState">
                        ${isFiltered ? '找不到符合條件的書籍' : '目前沒有書籍'}
                    </div>
                </div>`;
            return;
        }

        resultCount.textContent = `共 ${books.length} 本`;
        books.forEach(book => {
            const bookElement = document.createElement('div');
            bookElement.className = 'col-sm-6 col-lg-4 mb-4';
            bookElement.innerHTML = `
                <div class="card book-card">
                    <div class="book-image-container">
                        <img src="${escapeHtml(book.imageUrl)}" alt="書籍照片" class="book-image">
                    </div>
                    <div class="card-body">
                        <h5 class="card-title">${escapeHtml(book.title)}</h5>
                        <span class="badge bg-info text-dark mb-2">${escapeHtml(book.subject)}</span>
                        ${book.conditionGrade ? `<span class="badge bg-success mb-2" title="${escapeHtml(conditionDescription(book.conditionGrade))}">書況：${escapeHtml(book.conditionGrade)}</span>` : ''}
                        <span class="badge bg-warning text-dark mb-2">${escapeHtml(book.status)}</span>
                        <p class="price mb-2">NT$ ${book.price}</p>
                        ${book.author ? `<p class="card-text mb-1">作者：${escapeHtml(book.author)}</p>` : ''}
                        ${book.condition ? `<p class="card-text condition mb-1">書況說明：${escapeHtml(book.condition)}</p>` : ''}
                        <p class="card-text small mb-1"><i class="fas fa-truck"></i> ${escapeHtml(deliveryText(book))}</p>
                        ${book.sellerName ? `<p class="card-text text-muted small mb-0">賣家：${escapeHtml(book.sellerName)}</p>` : ''}
                    </div>
                    <div class="card-footer bg-white border-0 pb-3">${cartButton(book)}</div>
                </div>`;
            bookList.appendChild(bookElement);
        });
    }

    // 卡片下方的按鈕：自己的書不顯示購買按鈕（US05 測試方法）。
    // T06 起列表只會有「上架中」的書；保留中、已售出的判斷留著，以防單本書的資料比列表新
    function cartButton(book) {
        if (book.status === '保留中') return '<span class="text-muted"><i class="fas fa-lock"></i> 已保留，暫時不能購買</span>';
        if (book.status === '已售出') return '<span class="text-muted"><i class="fas fa-check"></i> 已售出</span>';
        if (!ORDERABLE_BOOK_STATUSES.includes(book.status)) return '';
        if (!book.sellerId) return '<span class="text-muted small">沒有賣家資料，不能下單</span>';
        if (currentUser && book.sellerId === currentUser.id) return '<span class="text-muted small">這是你刊登的書</span>';
        if (getCart().some(item => item.id === book.id)) {
            return '<a class="btn btn-outline-secondary btn-sm" href="cart.html"><i class="fas fa-check"></i> 已在購物車</a>';
        }
        return `<button class="btn btn-primary btn-sm add-to-cart" data-id="${escapeHtml(book.id)}">
                    <i class="fas fa-cart-plus"></i> 加入購物車</button>`;
    }

    function addToCart(book) {
        const cart = getCart();
        // 購物車已有同名書籍（不同賣家）時先提示（US04 註記）
        const sameTitle = cart.find(item => item.title === book.title);
        if (sameTitle && !confirm(`購物車已有同名書籍《${book.title}》（賣家：${sameTitle.sellerName}），仍要加入嗎？`)) {
            return;
        }
        cart.push({
            id: book.id, title: book.title, author: book.author, price: book.price,
            sellerId: book.sellerId, sellerName: book.sellerName, shippable: book.shippable, shippingFee: book.shippingFee
        });
        saveCart(cart);
        showAlert('message', 'success', `已加入購物車：《${book.title}》`);
        renderBooks(lastBooks, lastFiltered);
    }

    document.getElementById('bookList').addEventListener('click', function (e) {
        const button = e.target.closest('.add-to-cart');
        if (!button) return;
        const book = lastBooks.find(b => b.id === button.dataset.id);
        if (book) addToCart(book);
    });

    document.getElementById('searchForm').addEventListener('submit', function (e) {
        e.preventDefault();
        fetchBooks();
    });

    // 選科目、書況或排序後直接更新，不用再按搜尋
    ['subject', 'conditionGrade', 'sort'].forEach(id =>
        document.getElementById(id).addEventListener('change', fetchBooks));

    document.addEventListener('DOMContentLoaded', async function () {
        // 先知道登入者是誰，卡片才能判斷「這是你刊登的書」
        await renderNavbar();
        fillSubjectOptions(document.getElementById('subject'));
        fillConditionOptions(document.getElementById('conditionGrade'), false);

        fetchBooks();
    });
</script>
</body>
</html>
