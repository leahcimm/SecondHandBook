<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海大二手書交易平台｜登入</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
</head>
<body>
<nav id="navbar"></nav>

<div class="container" style="max-width: 480px;">
    <h1 class="h3 mb-3">登入</h1>
    <div id="message"></div>

    <form id="loginForm" novalidate>
        <div class="mb-3">
            <label for="email" class="form-label">學校 Email</label>
            <input type="email" class="form-control" id="email" name="email" autocomplete="username"
                   placeholder="例如：01234567@mail.ntou.edu.tw">
            <div class="invalid-feedback">請填寫 Email</div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">密碼</label>
            <input type="password" class="form-control" id="password" name="password" autocomplete="current-password">
            <div class="invalid-feedback">請填寫密碼</div>
        </div>
        <button type="submit" class="btn btn-primary w-100">登入</button>
    </form>
    <p class="mt-3 text-center">還沒有帳號？<a href="register.html">註冊</a></p>
    <!-- 課程展示用的管理員帳號（T06，Michael 決定直接顯示），後端關掉 admin.show-on-login 時這塊不出現 -->
    <div id="demoAdmin"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script>
    // 登入後要回去的頁面（網址的 next）。只接受本站的路徑，避免被帶到別的網站。
    function nextPage() {
        const next = new URLSearchParams(window.location.search).get('next');
        if (next && next.startsWith('/') && !next.startsWith('//') && !next.startsWith('/\\')
                && !next.startsWith('/login.html')) {
            return next;
        }
        return 'index.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        document.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
        document.getElementById('message').innerHTML = '';
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        let ok = true;
        if (!email) { document.getElementById('email').classList.add('is-invalid'); ok = false; }
        if (!password) { document.getElementById('password').classList.add('is-invalid'); ok = false; }
        if (!ok) return;

        const button = this.querySelector('button[type="submit"]');
        button.disabled = true;
        button.textContent = '登入中...';
        try {
            // 登入由 Spring Security 處理，要用表單格式送（T05），不是 JSON
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ email, password })
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.message || '登入失敗');
            window.location.href = nextPage();
        } catch (error) {
            showAlert('message', 'danger', error.message === 'Failed to fetch' ? '無法連線到伺服器，請稍後再試' : error.message);
            button.disabled = false;
            button.textContent = '登入';
        }
    });

    // 展示用管理員帳號：從後端拿，按「帶入」就填進表單
    async function showDemoAdmin() {
        try {
            const response = await fetch('/api/auth/demo-admin');
            if (!response.ok) return;
            const admin = await response.json();
            document.getElementById('demoAdmin').innerHTML = `
                <div class="alert alert-light border small mt-3">
                    <i class="fas fa-user-shield"></i> 展示用管理員帳號（可審核書籍）<br>
                    Email：<code id="demoAdminEmail">${escapeHtml(admin.email)}</code><br>
                    密碼：<code id="demoAdminPassword">${escapeHtml(admin.password)}</code>
                    <button type="button" class="btn btn-outline-secondary btn-sm ms-2" id="fillAdmin">帶入</button>
                </div>`;
            document.getElementById('fillAdmin').addEventListener('click', () => {
                document.getElementById('email').value = admin.email;
                document.getElementById('password').value = admin.password;
            });
        } catch (e) {
            // 拿不到就不顯示
        }
    }

    document.addEventListener('DOMContentLoaded', async function () {
        showDemoAdmin();
        const user = await renderNavbar();
        if (user) {
            showAlert('message', 'info', `你已經用 ${user.name} 登入了。要換帳號，請先按右上角的「登出」。`);
        } else if (new URLSearchParams(window.location.search).get('registered') === '1') {
            // 從註冊頁跳過來（US01 測試方法：註冊成功跳轉到登入頁）
            showAlert('message', 'success', '註冊成功，請登入。');
        } else if (new URLSearchParams(window.location.search).get('next')) {
            showAlert('message', 'warning', '請先登入。');
        }
    });
</script>
</body>
</html>
