<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海大二手書交易平台｜我的刊登</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <style>
        .thumb { width: 96px; height: 96px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>
<nav id="navbar"></nav>

<!-- 我的刊登（T06）：賣家看自己刊登的每一本書和狀態。被管理員退回的書會顯示退回原因（US07）。 -->
<div class="container" style="max-width: 860px;">
    <h1 class="h3 mb-3">我的刊登</h1>
    <p class="text-muted small">新刊登的書是「待審核」，管理員核准後變成「上架中」，買家才看得到、才能下單。</p>
    <div id="message"></div>
    <div id="bookList"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script>
    // 每種狀態給賣家的說明
    function statusNote(book) {
        if (book.status === '待審核') {
            return '<div class="small text-muted">等待管理員審核，核准後才會出現在書籍列表。</div>';
        }
        if (book.status === '已退回') {
            return `<div class="alert alert-danger py-2 mb-0 reject-reason"><i class="fas fa-exclamation-circle"></i>
                退回原因：${escapeHtml(book.rejectReason)}</div>`;
        }
        if (book.status === '上架中') {
            return '<div class="small text-muted">已在書籍列表上，買家可以下單。</div>';
        }
        return '';
    }

    function renderBooks(books) {
        const list = document.getElementById('bookList');
        if (books.length === 0) {
            list.innerHTML = '<div class="alert alert-secondary text-center" id="emptyBooks">你還沒有刊登任何書。<a href="sell.html">去刊登</a></div>';
            return;
        }
        list.innerHTML = books.map(book => `
            <div class="card mb-3 my-book" data-id="${escapeHtml(book.id)}">
                <div class="card-body d-flex gap-3">
                    <img src="${escapeHtml(book.imageUrl)}" alt="書籍照片" class="thumb">
                    <div class="flex-grow-1">
                        <div class="d-flex flex-wrap justify-content-between gap-2">
                            <h2 class="h5 mb-1">${escapeHtml(book.title)}</h2>
                            <span class="badge ${BOOK_STATUS_BADGE[book.status] || 'bg-secondary'} book-status align-self-start">${escapeHtml(book.status)}</span>
                        </div>
                        <p class="mb-1 small">${escapeHtml(book.subject)}・書況：${escapeHtml(book.conditionGrade)}・NT$ ${book.price}</p>
                        <p class="mb-2 small text-muted">刊登時間：${escapeHtml(formatTime(book.createdAt))}</p>
                        ${statusNote(book)}
                    </div>
                </div>
            </div>`).join('');
    }

    document.addEventListener('DOMContentLoaded', async function () {
        // 要登入才知道是誰的書，沒登入直接帶去登入頁
        if (!await renderNavbar()) {
            goLogin();
            return;
        }
        // 從刊登頁成功跳過來（US02），提醒要等審核（US07）
        if (new URLSearchParams(window.location.search).get('posted') === '1') {
            showAlert('message', 'success', '刊登成功！書籍狀態為「待審核」，管理員核准後才會出現在書籍列表。');
            document.querySelector('#message .alert').id = 'successMessage';
            history.replaceState(null, '', 'my-books.html');
        }
        try {
            renderBooks(await api('/api/books/mine'));
        } catch (error) {
            document.getElementById('bookList').innerHTML =
                `<div class="alert alert-danger">無法載入你的刊登：${escapeHtml(error.message)}</div>`;
        }
    });
</script>
</body>
</html>
