
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的刊登｜海大二手書交易平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .book-image {
            width: 90px;
            height: 110px;
            object-fit: contain;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
        }
        .price {
            color: #d63384;
            font-weight: bold;
        }
        .book-row {
            background: white;
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 1px 4px rgba(0,0,0,.08);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="index.html"><i class="fas fa-book"></i> 海大二手書交易平台</a>
        <div>
            <a class="btn btn-light btn-sm me-2" href="index.html"><i class="fas fa-user"></i> 書籍列表</a>
            <a class="btn btn-light btn-sm" href="sell.html"><i class="fas fa-plus"></i> 刊登書籍</a>
        </div>
    </div>
</nav>

<div class="container mb-5">
    <h2 class="mb-4"><i class="fas fa-user-edit"></i> 我的刊登</h2>

    <div id="message"></div>

    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">查詢我的書籍</h5>
            <form id="sellerForm" class="row g-2">
                <div class="col-md-9">
                    <input type="text" class="form-control" id="sellerName"
                           placeholder="請輸入刊登時使用的賣家名稱" required>
                </div>
                <div class="col-md-3 d-grid">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-search"></i> 查詢刊登紀錄
                    </button>
                </div>
            </form>
            <small class="text-muted">
                請輸入刊登書籍時使用的相同賣家名稱。
            </small>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">我的書籍列表</h5>
        <span class="text-muted" id="resultCount"></span>
    </div>

    <div id="bookList">
        <div class="alert alert-secondary">
            請輸入賣家名稱，查詢你的刊登紀錄。
        </div>
    </div>
</div>

<script>
    const ACTIVE_STATUS = '上架中';

    function escapeText(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        })[char]);
    }

    function formatPrice(price) {
        const number = Number(price);
        return Number.isFinite(number) ? number.toLocaleString('zh-TW') : '未提供';
    }

    function showMessage(message, type = 'info') {
        document.getElementById('message').innerHTML = `
            <div class="alert alert-${type} alert-dismissible fade show">
                ${escapeText(message)}
                <button type="button" class="btn-close"
                        data-bs-dismiss="alert"></button>
            </div>`;
    }

    async function fetchMyBooks(sellerName) {
        const bookList = document.getElementById('bookList');
        const resultCount = document.getElementById('resultCount');

        bookList.innerHTML = `
            <div class="text-center py-4">
                <div class="spinner-border text-primary"></div>
                <p class="mt-2">正在查詢...</p>
            </div>`;
        resultCount.textContent = '';

        try {
            const response = await fetch(
                `/api/books/seller/${encodeURIComponent(sellerName)}`
            );

            if (!response.ok) {
                throw new Error(`查詢失敗，HTTP ${response.status}`);
            }

            const books = await response.json();
            renderBooks(books);
        } catch (error) {
            bookList.innerHTML = `
                <div class="alert alert-danger">
                    ${escapeText(error.message)}
                </div>`;
        }
    }

    function getStatusBadge(status) {
        const colors = {
            '待審核': 'bg-secondary',
            '上架中': 'bg-success',
            '保留中': 'bg-warning text-dark',
            '已售出': 'bg-primary',
            '已下架': 'bg-dark',
            '已退回': 'bg-danger'
        };

        const color = colors[status] || 'bg-secondary';

        return `<span class="badge ${color}">${escapeText(status || '未知狀態')}</span>`;
    }

    function renderBooks(books) {
        const bookList = document.getElementById('bookList');
        const resultCount = document.getElementById('resultCount');

        if (!books || books.length === 0) {
            resultCount.textContent = '共 0 本';
            bookList.innerHTML = `
                <div class="alert alert-secondary text-center">
                    找不到此賣家的刊登紀錄，請確認賣家名稱是否正確。
                </div>`;
            return;
        }

        resultCount.textContent = `共 ${books.length} 本`;

        bookList.innerHTML = books.map(book => {
            const image = book.imageUrl
                ? `<img src="${escapeText(book.imageUrl)}" class="book-image"
                        alt="書籍照片" onerror="this.style.display='none';">`
                : `<div class="book-image d-flex align-items-center justify-content-center">
                        <i class="fas fa-book fa-2x text-muted"></i>
                   </div>`;

            const delistButton = book.status === ACTIVE_STATUS
                ? `<button class="btn btn-outline-danger btn-sm"
                           onclick="delistBook('${encodeURIComponent(book.id)}')">
                       <i class="fas fa-times"></i> 下架
                   </button>`
                : '';

            return `
                <div class="book-row">
                    <div class="row align-items-center g-3">
                        <div class="col-auto">
                            ${image}
                        </div>

                        <div class="col">
                            <h5 class="mb-2">${escapeText(book.title)}</h5>
                            <p class="text-muted small mb-1">
                                作者：${escapeText(book.author || '未提供')}
                            </p>
                            <p class="text-muted small mb-1">
                                科目：${escapeText(book.subject || '未提供')}
                            </p>
                            <p class="text-muted small mb-1">
                                書況：${escapeText(book.conditionGrade || '未提供')}
                            </p>
                            <p class="price mb-1">
                                NT$ ${formatPrice(book.price)}
                            </p>
                            ${getStatusBadge(book.status)}
                            ${book.reviewReason ? `
    <div class="alert alert-danger mt-2 mb-0 py-2">
        <strong>管理員退回原因：</strong>
        ${escapeText(book.reviewReason)}
    </div>
` : ''}
                        </div>

                        <div class="col-md-auto d-flex flex-column gap-2">
                            <a href="book-detail.html?id=${encodeURIComponent(book.id)}"
                               class="btn btn-outline-primary btn-sm">
                                <i class="fas fa-eye"></i> 查看詳情
                            </a>
                            ${delistButton}
                        </div>
                    </div>
                </div>`;
        }).join('');
    }

    async function delistBook(encodedId) {
        const sellerName = document.getElementById('sellerName').value.trim();

        if (!sellerName) {
            showMessage('請先輸入賣家名稱。', 'warning');
            return;
        }

        if (!confirm('確定要將這本書下架嗎？')) {
            return;
        }

        try {
            const id = decodeURIComponent(encodedId);
            const url = `/api/books/${encodeURIComponent(id)}/delist?sellerName=${encodeURIComponent(sellerName)}`;

            const response = await fetch(url, {
                method: 'PATCH'
            });

            if (!response.ok) {
                let errorMessage = `下架失敗，HTTP ${response.status}`;

                try {
                    const errorData = await response.json();
                    if (errorData.message) {
                        errorMessage = errorData.message;
                    }
                } catch (_) {
                    // 若後端沒有回傳 JSON，保留預設錯誤訊息
                }

                throw new Error(errorMessage);
            }

            showMessage('書籍已成功下架！', 'success');

            // 重新載入賣家的書籍列表，更新書籍狀態
            fetchMyBooks(sellerName);
        } catch (error) {
            showMessage(error.message, 'danger');
        }
    }

    document.getElementById('sellerForm').addEventListener('submit', function(event) {
        event.preventDefault();

        const sellerName = document.getElementById('sellerName').value.trim();

        if (!sellerName) {
            showMessage('請輸入賣家名稱。', 'warning');
            return;
        }

        fetchMyBooks(sellerName);
    });

    // 如果之前查詢過，重新整理頁面後保留賣家名稱
    document.addEventListener('DOMContentLoaded', function() {
        const savedName = sessionStorage.getItem('mySellerName');

        if (savedName) {
            document.getElementById('sellerName').value = savedName;
            fetchMyBooks(savedName);
        }
    });

    document.getElementById('sellerForm').addEventListener('submit', function() {
        const sellerName = document.getElementById('sellerName').value.trim();
        sessionStorage.setItem('mySellerName', sellerName);
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
