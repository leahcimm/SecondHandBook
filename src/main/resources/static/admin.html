<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>管理員審核｜海大二手書交易平台</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .admin-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,.08);
        }

        .book-image {
            width: 120px;
            height: 150px;
            object-fit: contain;
            background: #f8f9fa;
            border-radius: 6px;
        }

        .price {
            color: #d63384;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .section-title {
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            <i class="fas fa-book"></i>
            海大二手書交易平台
        </a>

        <a href="index.html" class="btn btn-light btn-sm">
            <i class="fas fa-home"></i> 返回首頁
        </a>
    </div>
</nav>

<div class="container mb-5">

    <h2 class="mb-4">
        <i class="fas fa-clipboard-check"></i>
        管理員書籍審核
    </h2>

    <div id="message"></div>

    <!-- 管理員驗證 -->
    <div class="admin-card">

        <h5 class="mb-3">
            <i class="fas fa-lock"></i>
            管理員驗證
        </h5>

        <form id="adminForm" class="row g-2">

            <div class="col-md-9">
                <input type="password"
                       class="form-control"
                       id="adminKey"
                       placeholder="請輸入管理員金鑰"
                       autocomplete="off"
                       required>
            </div>

            <div class="col-md-3 d-grid">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i>
                    驗證並載入
                </button>
            </div>

        </form>

        <small class="text-muted">
            請輸入管理員金鑰後，才能查看及審核待審核書籍。
        </small>

    </div>

    <!-- 待審核書籍 -->
    <div class="d-flex justify-content-between align-items-center mb-3">

        <h5 class="section-title mb-0">
            <i class="fas fa-book-open"></i>
            待審核書籍
        </h5>

        <button class="btn btn-outline-primary btn-sm"
                id="refreshButton"
                type="button"
                disabled>
            <i class="fas fa-sync-alt"></i>
            重新整理
        </button>

    </div>

    <p class="text-muted" id="resultCount"></p>

    <div id="bookList">
        <div class="alert alert-secondary text-center">
            請先輸入管理員金鑰。
        </div>
    </div>

</div>

<script>

    let adminKey = '';

    // HTML 跳脫，避免使用者輸入內容被當成 HTML 執行
    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        })[char]);
    }

    // 顯示提示訊息
    function showMessage(message, type = 'info') {

        document.getElementById('message').innerHTML = `
            <div class="alert alert-${type} alert-dismissible fade show">
                ${escapeHtml(message)}

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                </button>
            </div>
        `;
    }

    // 格式化價格
    function formatPrice(price) {
        const number = Number(price);
        return Number.isFinite(number)
            ? number.toLocaleString('zh-TW')
            : '未提供';
    }

    // 取得錯誤訊息
    async function getErrorMessage(response) {
        try {
            const data = await response.json();
            return data.detail || data.message ||
                `操作失敗，HTTP ${response.status}`;
        } catch (_) {
            return `操作失敗，HTTP ${response.status}`;
        }
    }

    // 載入待審核書籍
    async function loadPendingBooks() {

        const bookList = document.getElementById('bookList');
        const resultCount = document.getElementById('resultCount');

        bookList.innerHTML = `
            <div class="text-center py-4">
                <div class="spinner-border text-primary"></div>
                <p class="mt-2">正在載入待審核書籍...</p>
            </div>
        `;

        resultCount.textContent = '';

        try {

            const response = await fetch('/api/books/admin/pending', {
                method: 'GET',
                headers: {
                    'X-Admin-Key': adminKey
                }
            });

            if (!response.ok) {
                throw new Error(await getErrorMessage(response));
            }

            const books = await response.json();

            renderBooks(books);

        } catch (error) {

            bookList.innerHTML = `
                <div class="alert alert-danger">
                    ${escapeHtml(error.message)}
                </div>
            `;

            resultCount.textContent = '';
        }
    }

    // 顯示待審核書籍
    function renderBooks(books) {

        const bookList = document.getElementById('bookList');
        const resultCount = document.getElementById('resultCount');

        bookList.innerHTML = '';

        if (!books || books.length === 0) {

            resultCount.textContent = '共 0 本';

            bookList.innerHTML = `
                <div class="alert alert-success text-center">
                    <i class="fas fa-check-circle"></i>
                    目前沒有待審核的書籍。
                </div>
            `;

            return;
        }

        resultCount.textContent = `共 ${books.length} 本待審核書籍`;

        books.forEach(book => {

            const element = document.createElement('div');
            element.className = 'admin-card';

            const image = book.imageUrl
                ? `<img src="${escapeHtml(book.imageUrl)}"
                        class="book-image"
                        alt="書籍照片"
                        onerror="this.style.display='none';">`
                : `<div class="book-image d-flex align-items-center justify-content-center">
                        <i class="fas fa-book fa-3x text-muted"></i>
                   </div>`;

            element.innerHTML = `

                <div class="row g-3 align-items-center">

                    <div class="col-auto">
                        ${image}
                    </div>

                    <div class="col-md">

                        <h5 class="mb-2">
                            ${escapeHtml(book.title)}
                        </h5>

                        <p class="mb-1">
                            作者：${escapeHtml(book.author || '未提供')}
                        </p>

                        <p class="mb-1">
                            科目：${escapeHtml(book.subject || '未提供')}
                        </p>

                        <p class="mb-1">
                            書況等級：${escapeHtml(book.conditionGrade || '未提供')}
                        </p>

                        <p class="mb-1">
                            書況說明：${escapeHtml(book.condition || '沒有額外說明')}
                        </p>

                        <p class="mb-1">
                            賣家：${escapeHtml(book.sellerName || '未提供')}
                        </p>

                        <p class="price mb-2">
                            NT$ ${formatPrice(book.price)}
                        </p>

                        <span class="badge bg-warning text-dark">
                            待審核
                        </span>

                    </div>

                    <div class="col-md-auto">

                        <div class="d-flex flex-column gap-2">

                            <a href="book-detail.html?id=${encodeURIComponent(book.id)}"
                               class="btn btn-outline-primary btn-sm">
                                <i class="fas fa-eye"></i>
                                查看詳細資料
                            </a>

                            <button type="button"
                                    class="btn btn-success btn-sm approve-button"
                                    data-id="${escapeHtml(book.id)}">
                                <i class="fas fa-check"></i>
                                核准
                            </button>

                            <button type="button"
                                    class="btn btn-outline-danger btn-sm return-button"
                                    data-id="${escapeHtml(book.id)}">
                                <i class="fas fa-undo"></i>
                                退回
                            </button>

                        </div>

                    </div>

                </div>
            `;

            bookList.appendChild(element);
        });
    }

    // 核准書籍
    async function approveBook(id) {

        if (!confirm('確定要核准這本書籍嗎？')) {
            return;
        }

        try {

            const response = await fetch(
                `/api/books/${encodeURIComponent(id)}/approve`,
                {
                    method: 'PATCH',
                    headers: {
                        'X-Admin-Key': adminKey
                    }
                }
            );

            if (!response.ok) {
                throw new Error(await getErrorMessage(response));
            }

            showMessage('書籍已成功核准，現在狀態為「上架中」。', 'success');

            await loadPendingBooks();

        } catch (error) {

            showMessage(error.message, 'danger');
        }
    }

    // 退回書籍
    async function returnBook(id) {

        const reason = prompt(
            '請輸入退回原因：'
        );

        // 按下取消
        if (reason === null) {
            return;
        }

        // 不允許空白原因
        if (!reason.trim()) {
            showMessage('退回原因不可為空白，請重新輸入。', 'warning');
            return;
        }

        try {

            const response = await fetch(
                `/api/books/${encodeURIComponent(id)}/return`,
                {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Admin-Key': adminKey
                    },
                    body: JSON.stringify({
                        reason: reason.trim()
                    })
                }
            );

            if (!response.ok) {
                throw new Error(await getErrorMessage(response));
            }

            showMessage('書籍已退回，退回原因已儲存。', 'success');

            await loadPendingBooks();

        } catch (error) {

            showMessage(error.message, 'danger');
        }
    }

    // 管理員驗證與載入
    document.getElementById('adminForm').addEventListener('submit', async function(event) {

        event.preventDefault();

        adminKey = document.getElementById('adminKey').value.trim();

        if (!adminKey) {
            showMessage('請輸入管理員金鑰。', 'warning');
            return;
        }

        document.getElementById('refreshButton').disabled = false;

        await loadPendingBooks();
    });

    // 重新整理
    document.getElementById('refreshButton').addEventListener('click', function() {
        loadPendingBooks();
    });

    // 使用事件委派處理核准及退回按鈕
    document.getElementById('bookList').addEventListener('click', function(event) {

        const approveButton = event.target.closest('.approve-button');
        const returnButton = event.target.closest('.return-button');

        if (approveButton) {
            approveBook(approveButton.dataset.id);
        }

        if (returnButton) {
            returnBook(returnButton.dataset.id);
        }
    });

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
